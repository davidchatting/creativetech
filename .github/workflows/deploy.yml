name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build minimal site
        run: |
          mkdir -p dist
          pandoc index.md --template=template.html --standalone \
            --metadata title="Preferable Pasts, Presents, and Futures of Creative Technology" \
            -o dist/index.html
          cp cfp.txt dist/
          cp "Preferable_Pasts__Presents__and_Futures_of_Creative_Technology.pdf" dist/
          cp CNAME dist/
          cp -r js dist/
          cp og.html dist/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate social share thumbnail
        run: |
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory dist &
          sleep 2
          node scripts/screenshot-og.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
