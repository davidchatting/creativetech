<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(title)$$title$$else$Creative Technology$endif$</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: "Courier New", Courier, monospace;
    line-height: 1.6;
    color: #1a1a1a;
  }
  #content {
    position: relative;
    z-index: 1;
    max-width: 40em;
    margin: 3em auto;
    padding: 1.5em;
    background: rgba(255, 255, 255, 0.85);
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; }
    #content { background: rgba(18, 18, 18, 0.85); }
    a { color: #7ab8ff; }
  }
  h1 { font-size: 1.6em; line-height: 1.3; }
  a { color: #0645ad; }
  em { color: #888; font-style: normal; }
  @media (prefers-color-scheme: dark) {
    em { color: #999; }
  }
  #p5-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  #p5-overlay canvas {
    display: block;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="p5-overlay"></div>
<div id="content">
$body$
</div>
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.min.js"></script>
<script src="js/sketch.js"></script>
<script type="module" src="js/email.js"></script>
</body>
</html>
